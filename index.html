<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
      <body>
      
    <a-scene 
      
      <a-assets>
        <video id="video1" src="./assets/films/Temoin3extra.mp4"></video>
        <video id="video2" src="./assets/films/Temoin2extra.mp4"></video>
        <video id="video3" src="./assets/films/Temoin1extra.mp4"></video>
        <img id="logo" src="./assets/object/Logo-simplifie-NB.jpg" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

      <a-entity >
        <a-plane id="logo-simplified" src="#logo" position="-0.36446 0.45983 0.18071" height="0.15" width="0.25" rotation="15 0 0" material="blending:normal"></a-plane>
        <a-plane id="videoPlane" src="#video1" position="0 0 0" height="1.2" width="1" material="shader:flat"></a-plane>
      </a-entity>
    
          
        </a-scene>


        
    

  </body>
</html>
